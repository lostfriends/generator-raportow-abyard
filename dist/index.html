    .ekran-formularz { padding-bottom: 260px !important; }

    /* Tabele, kt\xF3re MAJ\u0104 ju\u017C w\u0142asny kontener przewijania (np. harmonogram) \u2014 nie nak\u0142adaj

    .arow-act { width: 100%; justify-content: flex-start !important; }
